<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auspex — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070B; --card:#0B1018; --card2:#0E141E; --bd:#1A2433; --bd2:#243245;
  --text:#F5F7FA; --sub:#8B9BB3; --faint:#5C6B82;
  --accent:#3B82F6; --pos:#10B981; --neg:#EF4444;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;padding:0 22px;height:60px;background:rgba(5,7,11,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.brand .mk{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand .nm{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.18em}
.search{flex:1;display:flex;align-items:center;gap:10px;max-width:680px}
.searchbox{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;height:40px;padding:0 12px;transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.searchbox svg{width:15px;height:15px;color:var(--faint);flex-shrink:0}
.searchbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.searchbox input::placeholder{color:var(--faint);text-transform:none;letter-spacing:0}
.kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--bd);border-radius:5px;padding:1px 6px}
.go{height:40px;padding:0 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:filter .15s}
.go:hover{filter:brightness(1.1)}
.hstat{display:flex;align-items:center;gap:22px;flex-shrink:0}
.st{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.st .l{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint)}
.st .v{font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.g{background:var(--pos);box-shadow:0 0 7px var(--pos)} .dot.r{background:var(--neg)} .dot.b{background:var(--accent);box-shadow:0 0 7px var(--accent)}

.wrap{max-width:1200px;margin:0 auto;padding:22px 22px 60px}
.seclbl{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.seclbl .n{color:var(--accent)} .seclbl .line{flex:1;height:1px;background:var(--bd)}
.seclbl:first-of-type{margin-top:4px}
.seclbl .act{color:var(--sub);text-transform:none;letter-spacing:.04em;cursor:pointer;font-size:11px}
.seclbl .act:hover{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;transition:border-color .15s,background .15s}
.card.hov:hover{border-color:var(--bd2);background:var(--card2)}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.fade{opacity:0;transform:translateY(6px);animation:fade .4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1;transform:none}}
.crumb{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--sub);cursor:pointer;margin-bottom:4px}
.crumb:hover{color:var(--accent)}

/* home: brief */
.brief{border-left:2px solid var(--accent);background:linear-gradient(90deg,rgba(59,130,246,.05),transparent 60%)}
.brief .h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.brief .lead{font-size:15px;color:#DCE3EE;line-height:1.7;margin-bottom:12px}
.brief ul{list-style:none;margin:0;padding:0}
.brief li{position:relative;padding:7px 0 7px 18px;font-size:14px;color:#CBD4E2;border-bottom:1px solid rgba(26,36,51,.5)}
.brief li:last-child{border-bottom:0}
.brief li::before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.brief b{color:var(--text);font-weight:600}

/* opportunities */
.opps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.opp{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:15px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opp:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--card2)}
.opp .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.opp .tk{font-family:var(--mono);font-weight:700;font-size:15px}
.opp .sc{display:flex;align-items:baseline;gap:5px}
.opp .sc .n{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em}
.opp .sc .d{font-family:var(--mono);font-size:11px;color:var(--faint)}
.opp .fac{font-size:12px;color:var(--sub);margin:9px 0 11px;min-height:32px;line-height:1.35}
.opp .ft{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.opp .chg{font-weight:600}
.rtg{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:5px;border:1px solid}
.skel{background:linear-gradient(90deg,#0B1018,#111825,#0B1018);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}

/* market pulse */
.pulse{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ptile{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:13px 14px}
.ptile .nm{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:600}
.ptile .sub{font-size:10px;color:var(--faint);margin-top:1px}
.ptile .px{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:9px}
.ptile .ch{font-family:var(--mono);font-size:11.5px;font-weight:600;margin-top:3px}

/* watchlist */
.wl-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.wl-row:last-child{border-bottom:0}
.wl-row:hover{background:var(--card2)}
.wl-row .tk{font-family:var(--mono);font-weight:600;width:70px}
.wl-row .nm{flex:1;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-row .sc{font-family:var(--mono);font-weight:700;width:42px;text-align:right}
.wl-row .rm{color:var(--faint);font-size:16px;width:20px;text-align:center}
.wl-row .rm:hover{color:var(--neg)}
.wl-add{display:flex;gap:8px;margin-top:14px}
.wl-add input{flex:1;background:#0A0F17;border:1px solid var(--bd);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:13px;padding:0 12px;height:36px;text-transform:uppercase;outline:none}
.wl-add input:focus{border-color:var(--accent)}
.wl-add button{height:36px;padding:0 14px;border:0;border-radius:7px;background:var(--card2);border:1px solid var(--bd);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
.wl-add button:hover{border-color:var(--accent);color:var(--accent)}

/* snapshot + analysis */
.snap{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.snap-id .tk{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.08em;font-weight:600}
.snap-id h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.snap-id .meta{color:var(--sub);font-size:13px}
.snap-id .px{display:flex;align-items:baseline;gap:12px;margin-top:18px;flex-wrap:wrap}
.snap-id .px .p{font-family:var(--mono);font-size:30px;font-weight:600}
.snap-id .px .cur{font-family:var(--mono);font-size:13px;color:var(--sub);margin-left:-6px}
.snap-id .px .ch{font-family:var(--mono);font-size:14px;font-weight:600}
.snap-id .px .ch .t{font-size:10px;color:var(--faint);letter-spacing:.08em;margin-left:4px}
.snap-id .mc{margin-top:8px;font-family:var(--mono);font-size:12.5px;color:var(--sub)}
.snap-id .mc b{color:var(--text);font-weight:600}
.scoreblk{border-left:1px solid var(--bd);padding-left:22px;display:flex;flex-direction:column;justify-content:center}
.scoreblk .rt{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.04em}
.scoreblk .sv{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.scoreblk .sv .n{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.scoreblk .sv .d{font-family:var(--mono);font-size:15px;color:var(--faint)}
.scoreblk .cf{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--sub)}
.hg{margin-top:16px}
.hg-track{position:relative;height:8px;border-radius:5px;background:#0A0F17;border:1px solid var(--bd);overflow:hidden}
.hg-fill{height:100%;width:0;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hg-scale{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:13px 15px;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--bd2);transform:translateY(-1px)}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:9px}
.kpi .val .u{font-size:12px;color:var(--sub);margin-left:4px;font-weight:400}
.kpi .val.na{color:var(--faint);font-size:18px}

.fbar{margin-bottom:14px}
.fbar:last-child{margin-bottom:0}
.fbar-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.fbar-h .l{font-size:13px;color:var(--sub)} .fbar-h .v{font-family:var(--mono);font-size:14px;font-weight:600}
.fbar-t{height:6px;border-radius:4px;background:#0A0F17;border:1px solid var(--bd);overflow:hidden}
.fbar-f{height:100%;width:0;border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

.radar{width:100%;max-width:360px;display:block;margin:4px auto}
.radar-lbl{font-family:var(--mono);font-size:10px;fill:var(--sub);letter-spacing:.06em}
.radar-val{animation:rin .5s ease forwards;opacity:0}
@keyframes rin{to{opacity:1}}

/* why now / portfolio */
.why{display:flex;flex-direction:column;gap:10px}
.why .row{display:flex;align-items:center;gap:10px;font-size:13.5px}
.why .mk{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.why .mk.on{background:rgba(16,185,129,.14);color:var(--pos)} .why .mk.off{background:rgba(92,107,130,.12);color:var(--faint)}
.why .row.off{color:var(--faint)}
.conv{margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.conv .l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--faint)}
.conv .v{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:4px}
.stars{font-size:20px;letter-spacing:3px;color:var(--accent)}
.stars .e{color:var(--bd2)}
.profile{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pchip{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:6px;border:1px solid var(--bd);color:var(--faint)}
.pchip.on{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.pchip.na{opacity:.45}

/* thesis / news / etc */
.th-block{margin-bottom:18px} .th-block:last-child{margin-bottom:0}
.th-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.th-h .b{width:7px;height:7px;border-radius:2px}
.prose{font-size:14.5px;color:#D4DCE8;line-height:1.7}
.ul{list-style:none;margin:0;padding:0}
.ul li{position:relative;padding:6px 0 6px 18px;font-size:14px;color:#CBD4E2;border-bottom:1px solid rgba(26,36,51,.6)}
.ul li:last-child{border-bottom:0}
.ul li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%}
.ul.pos li::before{background:var(--pos)} .ul.neg li::before{background:var(--neg)}
.nw{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd)}
.nw:last-child{border-bottom:0}
.nw .body{flex:1;min-width:0} .nw .t{font-size:13.5px;color:var(--text);line-height:1.45}
.nw .p{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px}
.rtag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;padding:3px 8px;border-radius:5px;flex-shrink:0;margin-top:1px;border:1px solid}
.rtag.h{color:var(--pos);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.rtag.m{color:var(--accent);border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08)}
.rtag.l{color:var(--sub);border-color:var(--bd)}
.empty{color:var(--faint);font-family:var(--mono);font-size:13px;padding:6px 0}
.cat{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(26,36,51,.6);font-size:13px;color:var(--sub)}
.cat:last-child{border-bottom:0} .cat .d{font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0;letter-spacing:.08em}
.exec{font-size:15px;line-height:1.75;color:#DCE3EE}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:15px;padding-top:13px;border-top:1px solid var(--bd)}

.lead{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid var(--bd)}
.lead:last-child{border-bottom:0}
.lead .rk{font-family:var(--mono);font-size:13px;color:var(--faint);width:24px;text-align:center;font-weight:600}
.lead .tk{font-family:var(--mono);font-weight:600;width:62px}
.lead .nm{flex:1;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .cs{font-family:var(--mono);font-weight:700;font-size:16px;width:40px;text-align:right}
.cbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cbar .tk{font-family:var(--mono);font-weight:600;width:64px;font-size:13px}
.cbar .track{flex:1;height:22px;border-radius:6px;background:#0A0F17;border:1px solid var(--bd);overflow:hidden}
.cbar .fill{height:100%;width:0;border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:9px}
.cbar .fill.me{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.cbar .fv{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#05070B}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
table.cmp th,table.cmp td{padding:9px 10px;text-align:center;border-top:1px solid var(--bd)}
table.cmp th{font-family:var(--mono);font-weight:600}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;color:var(--sub)}
table.cmp tr.hl td{background:rgba(59,130,246,.06)}
.tbest{color:var(--pos);font-weight:700}
.scroll-x{overflow-x:auto}

.loader{display:flex;align-items:center;gap:14px;padding:22px;color:var(--sub);font-family:var(--mono);font-size:13px}
.spin{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{border-color:rgba(239,68,68,.35);color:#F4A1A4;font-family:var(--mono);font-size:13px}
.why .rs{margin-left:auto;font-family:var(--mono);color:var(--faint);font-size:12px}
.pf-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(26,36,51,.6)}
.pf-row:last-child{border-bottom:0}
.pf-k{font-size:13.5px;color:var(--sub)}
.bf{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
.bf .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.bf .h.g{color:var(--pos)} .bf .h.r{color:var(--neg)}
.bf ul{list-style:none;margin:0;padding:0}
.bf li{position:relative;padding:6px 0 6px 22px;font-size:13.5px;color:#CBD4E2}
.bf li::before{position:absolute;left:0;top:5px;font-family:var(--mono);font-size:13px;font-weight:700}
.bf.best li::before{content:"\2713";color:var(--pos)}
.bf.ni li::before{content:"\2715";color:var(--neg)}
.note{font-size:11px;color:var(--faint);margin-top:16px;font-family:var(--mono);line-height:1.5}
.ctag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:4px;border:1px solid;flex-shrink:0;min-width:74px;text-align:center}
.cat .ct{flex:1;color:#CBD4E2}
.peerhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.pr-rk{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent)}
.pr-d{font-family:var(--mono);color:var(--faint);font-size:14px}
.pr-pc{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint);text-align:right}
.pr-pc b{display:block;color:var(--pos);font-size:20px;margin-top:3px;letter-spacing:0}
.vd{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.vd .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint)}
.vd .v{font-size:15px;margin-top:6px;color:#DCE3EE} .vd .v.big{font-family:var(--mono);font-size:21px;font-weight:700}
.vd .stars{font-size:22px;margin-top:4px}
.decision{margin-top:20px;padding-top:16px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.decision .dl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint)}
.decision .dv{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:.05em}

.isum{font-family:var(--mono);font-size:12.5px;color:var(--sub);margin:2px 0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ibucket{margin-bottom:22px}
.ibh{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.ibh.act{color:var(--neg)} .ibh.watch{color:var(--accent)}
.iled{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.iled.act{background:var(--neg);box-shadow:0 0 7px var(--neg)} .iled.watch{background:var(--accent);box-shadow:0 0 7px var(--accent)}
.ibx{display:grid;grid-template-columns:210px 1fr auto;gap:16px;align-items:center;padding:13px 15px;border:1px solid var(--bd);border-radius:9px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}

<body>
<header>
  <div class="brand" id="brand"><div class="mk">A</div><div class="nm">AUSPEX</div></div>
  <div class="search">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="ticker" type="text" autocomplete="off" spellcheck="false" placeholder="Search ticker — NVDA — or compare: NVDA, AMD, MSFT">
      <span class="kbd">/</span>
    </div>
    <button class="go" id="run">Analyze</button>
  </div>
  <div class="hstat">
    <div class="st"><span class="l">MARKET STATUS</span><span class="v" id="mkt"><span class="dot g"></span>—</span></div>
    <div class="st"><span class="l">ENGINE</span><span class="v" id="engine">—</span></div>
    <div class="st"><span class="l">LAST UPDATE</span><span class="v mono" id="upd">—</span></div>
  </div>
</header>

<div class="wrap">
  <section id="home"></section>
  <section id="loading" class="card hidden"><div class="loader"><span class="spin"></span><span id="loadingMsg">Loading…</span></div></section>
  <section id="error" class="card errbox hidden"></section>
  <section id="result"></section>
</div>

<footer>Research &amp; education only — not personalised investment advice. Data may be delayed or sampled.</footer>

<script>
var $=function(s){return document.querySelector(s);};
var OPPS=["NVDA","MSFT","GOOGL","AMD","PLTR"];
var DEFAULT_WL=["NVDA","MSFT","AMD","GOOGL","PLTR"];
var PULSE=[["SPY","S&P 500 ETF"],["QQQ","Nasdaq 100 ETF"],["VIXY","Volatility"],["BTC-USD","Bitcoin"],["GLD","Gold ETF"]];
var PEERS={
  NVDA:["NVDA","AMD","AVGO","QCOM","INTC"], AMD:["AMD","NVDA","AVGO","QCOM","INTC"],
  MSFT:["MSFT","GOOGL","AMZN","ORCL","IBM"], GOOGL:["GOOGL","MSFT","META","AMZN","AAPL"],
  PLTR:["PLTR","SNOW","CRM","NOW","DDOG"], AAPL:["AAPL","MSFT","GOOGL","SONY","DELL"],
  TSLA:["TSLA","GM","F","RIVN","NIO"], META:["META","GOOGL","SNAP","PINS","MSFT"], AMZN:["AMZN","MSFT","GOOGL","WMT","BABA"]
};
var DIMS=[["growth","Growth"],["profitability","Profitability"],["moat","Moat"],["valuation","Valuation"],["debt","Debt"],["momentum","Momentum"],["risk","Risk"]];
var RAD=[["growth","GROWTH"],["profitability","PROFIT"],["moat","MOAT"],["valuation","VALUE"],["debt","DEBT"],["momentum","MOMENTUM"],["risk","RISK"]];
var FACT={growth:"Growth momentum",profitability:"Profitability strength",moat:"Wide competitive moat",valuation:"Attractive valuation",debt:"Strong balance sheet",momentum:"Price momentum",risk:"Low risk profile"};

/* storage */
function jget(k,f){ try{var v=JSON.parse(localStorage.getItem(k));return v==null?f:v;}catch(e){return f;} }
function jset(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function wlGet(){ var v=jget("aa_wl",null); return Array.isArray(v)?v:DEFAULT_WL.slice(); }
function wlSet(a){ jset("aa_wl",a); }

/* fmt */
function money(v){ if(v==null||isNaN(v))return "n/a"; var s=v<0?"-":"";v=Math.abs(v);
  if(v>=1e12)return s+(v/1e12).toFixed(2)+"T";if(v>=1e9)return s+(v/1e9).toFixed(2)+"B";
  if(v>=1e6)return s+(v/1e6).toFixed(2)+"M";if(v>=1e3)return s+(v/1e3).toFixed(1)+"K";return s+v.toFixed(0); }
function fmtVal(v,fmt){ if(fmt==="money")return money(v);if(fmt==="pct1")return v.toFixed(1)+"%";
  if(fmt==="num1")return v.toFixed(1);if(fmt==="num2")return v.toFixed(2);return Math.round(v).toLocaleString(); }
function num1(v){return v==null?"n/a":Number(v).toFixed(1);} function pct1(v){return v==null?"n/a":(v*100).toFixed(1)+"%";}
function ratingColor(r){ if(r==="Strong Buy"||r==="Buy")return "var(--pos)"; if(r==="Reduce"||r==="Sell")return "var(--neg)"; return "var(--sub)"; }
function ratingHex(r){ if(r==="Strong Buy"||r==="Buy")return "#10B981"; if(r==="Reduce"||r==="Sell")return "#EF4444"; return "#8B9BB3"; }
function scoreHex(v){ return v>=67?"#10B981":v>=45?"#3B82F6":"#EF4444"; }
function topFactor(s){ var b=null,bv=-1; DIMS.forEach(function(p){ if(s[p[0]]>bv){bv=s[p[0]];b=p[0];} }); return {label:FACT[b],score:Math.round(bv)}; }

function counts(root){ (root||document).querySelectorAll("[data-count]").forEach(function(e){ if(e.getAttribute("data-done"))return; e.setAttribute("data-done","1");
  var to=parseFloat(e.getAttribute("data-count")),fmt=e.getAttribute("data-fmt")||"int",dur=600,st=null;
  function tk(n){ if(!st)st=n; var p=Math.min(1,(n-st)/dur),k=1-Math.pow(1-p,3); e.textContent=fmtVal(to*k,fmt); if(p<1)requestAnimationFrame(tk);} requestAnimationFrame(tk); }); }
function fillBars(root){ requestAnimationFrame(function(){ (root||document).querySelectorAll("[data-w]").forEach(function(b){ b.style.width=b.getAttribute("data-w"); }); }); }
function animate(root){ counts(root); fillBars(root); }

function ratingTag(r,cls){ var c=ratingHex(r); return '<span class="rtg '+(cls||"")+'" style="color:'+c+';border-color:'+c+'55;background:'+c+'14">'+r+'</span>'; }
function hgauge(score,rating){ var c=ratingHex(rating);
  return '<div class="hg"><div class="hg-track"><div class="hg-fill" data-w="'+score+'%" style="background:'+c+'"></div></div>'
    +'<div class="hg-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>'; }
function kpi(label,raw,fmt,unit){ var v=(raw==null||isNaN(raw))?'<div class="val na">n/a</div>'
    :'<div class="val"><span data-count="'+raw+'" data-fmt="'+fmt+'">0</span>'+(unit?'<span class="u">'+unit+'</span>':'')+'</div>';
  return '<div class="kpi"><div class="k">'+label+'</div>'+v+'</div>'; }
function fbar(label,val){ var c=scoreHex(val);
  return '<div class="fbar"><div class="fbar-h"><span class="l">'+label+'</span><span class="v" data-count="'+val+'" data-fmt="int">0</span></div>'
    +'<div class="fbar-t"><div class="fbar-f" data-w="'+val+'%" style="background:'+c+'"></div></div></div>'; }
function radar(s){ var sz=340,c=sz/2,R=sz*0.31,n=RAD.length;
  function a(i){return(-90+i*360/n)*Math.PI/180;} function pt(r,i){return[c+r*Math.cos(a(i)),c+r*Math.sin(a(i))];}
  var g=""; [0.2,0.4,0.6,0.8,1].forEach(function(k){var p=[];for(var i=0;i<n;i++){var q=pt(R*k,i);p.push(q[0].toFixed(1)+","+q[1].toFixed(1));}g+='<polygon points="'+p.join(" ")+'" fill="none" stroke="#1A2433"/>';});
  for(var i=0;i<n;i++){var p=pt(R,i);g+='<line x1="'+c+'" y1="'+c+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#1A2433"/>';var lp=pt(R+20,i);g+='<text class="radar-lbl" x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="middle">'+RAD[i][1]+'</text>';}
  var vp=[],dots=""; for(var j=0;j<n;j++){var val=s[RAD[j][0]]||0;var q=pt(R*val/100,j);vp.push(q[0].toFixed(1)+","+q[1].toFixed(1));dots+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3" fill="#3B82F6"/>';}
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="radar">'+g+'<g class="radar-val"><polygon points="'+vp.join(" ")+'" fill="rgba(59,130,246,.16)" stroke="#3B82F6" stroke-width="2"/>'+dots+'</g></svg>'; }
function sec(n,label,action){ return '<div class="seclbl"><span class="n">'+n+'</span> '+label+' <span class="line"></span>'+(action||"")+'</div>'; }
function card(body,cls){ return '<div class="card '+(cls||"")+'">'+body+'</div>'; }
function variation(f){
  if(f.day_change_pct!=null){ var q=f.day_change_pct,po=q>=0,cc=po?"var(--pos)":"var(--neg)"; return '<span class="ch" style="color:'+cc+'">'+(po?"+":"")+q.toFixed(2)+'%<span class="t">TODAY</span></span>'; }
  if(f.price==null||f.week52_low==null||f.week52_low==0)return '';
  var p=(f.price/f.week52_low-1)*100,pos=p>=0,c=pos?"var(--pos)":"var(--neg)";
  return '<span class="ch" style="color:'+c+'">'+(pos?"+":"")+p.toFixed(1)+'%<span class="t">VS 52W LOW</span></span>'; }
function spark(a){ if(!a||a.length<2)return ''; var w=140,h=34,mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),rg=(mx-mn)||1;
  var pts=a.map(function(v,i){return (i/(a.length-1)*w).toFixed(1)+","+(h-((v-mn)/rg)*(h-4)-2).toFixed(1);}).join(" ");
  var up=a[a.length-1]>=a[0],c=up?"#10B981":"#EF4444";
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block"><polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="1.6"/></svg>'; }
function snapExtra(f){ var o="";
  if(f.price_history&&f.price_history.length>1) o+='<div class="sparkw">'+spark(f.price_history)+'<span class="sub" style="font-size:10.5px">30-day</span></div>';
  if(f.target_mean!=null&&f.target_upside_pct!=null){ var tc=f.target_upside_pct>=0?"var(--pos)":"var(--neg)"; o+='<div class="xrow">Analyst target <b>'+Math.round(f.target_mean)+'</b> <span style="color:'+tc+'">'+(f.target_upside_pct>=0?"+":"")+Math.round(f.target_upside_pct)+'%</span>'+(f.num_analysts?' <span class="sub">· '+f.num_analysts+' analysts</span>':'')+'</div>'; }
  if(f.next_earnings_date&&f.days_to_earnings!=null){ var ec=f.days_to_earnings<=7?"var(--neg)":(f.days_to_earnings<=21?"var(--accent)":"var(--text)"); o+='<div class="xrow">Next earnings <b style="color:'+ec+'">'+f.days_to_earnings+'d</b> <span class="sub">· '+f.next_earnings_date+'</span></div>'; }
  return o; }
function valhist(f){ if(f.pe_history_percentile==null)return ''; var p=Math.round(f.pe_history_percentile); var lbl=p>=70?'<span style="color:var(--neg)">rich</span>':(p<=35?'<span style="color:var(--pos)">cheap</span>':'<span class="sub">mid-range</span>'); return '<div class="relval" style="margin-top:14px">Valuation vs history — P/E in the <b>'+p+'th percentile</b> of its 1-year range ('+lbl+')</div>'; }
function relTag(r){ if(r==null)return ''; if(r>=6)return '<span class="rtag h">HIGH</span>'; if(r>=3)return '<span class="rtag m">MEDIUM</span>'; return '<span class="rtag l">LOW</span>'; }

/* ===================== HOME ===================== */
/* ===================== INBOX (V0.3.1) ===================== */
var _inboxWL=[], _inboxRes={}, _lastAnalysis=null;
function memGet(){ return jget("aa_mem",{}); }
function memSet(o){ jset("aa_mem",o); }

function classify(t,d,base){
  var f=d.fundamentals; var cur={c:d.scores.composite,r:d.scores.rating,p:f.price};
  var today=(f.day_change_pct!=null)?f.day_change_pct:null, dte=(f.days_to_earnings!=null)?f.days_to_earnings:null;
  var reasons=[],material=false,minor=false;
  if(!base){ reasons.push("first scan, baseline set"); minor=true; }
  else { var dc=cur.c-base.c, dr=(cur.r!==base.r), dp=(base.p&&cur.p)?((cur.p/base.p-1)*100):null;
    if(dr){ reasons.push("rating "+base.r+" → "+cur.r); material=true; }
    if(Math.abs(dc)>=2){ reasons.push("score "+Math.round(base.c)+"→"+Math.round(cur.c)+" ("+(dc>=0?"+":"")+Math.round(dc)+")"); minor=true; if(Math.abs(dc)>=5)material=true; }
    if(dp!=null&&Math.abs(dp)>=4){ reasons.push("price "+(dp>=0?"+":"")+dp.toFixed(1)+"% since review"); minor=true; if(Math.abs(dp)>=8)material=true; } }
  if(today!=null&&Math.abs(today)>=3){ reasons.push("today "+(today>=0?"+":"")+today.toFixed(1)+"%"); minor=true; if(Math.abs(today)>=5)material=true; }
  if(dte!=null&&dte>=0&&dte<=7){ reasons.push("earnings in "+dte+"d"); material=true; }
  else if(dte!=null&&dte>=0&&dte<=21){ reasons.push("earnings in "+dte+"d"); minor=true; }
  return {bucket:material?"act":(minor?"watch":"nothing"),line:reasons.length?reasons.join(" · "):"No change since your last review",cur:cur};
}
function inboxRow(t,d,cl){
  var s=d.scores,f=d.fundamentals,c=ratingHex(s.rating);
  var day=(f.day_change_pct!=null)?'<span class="iday" style="color:'+(f.day_change_pct>=0?"var(--pos)":"var(--neg)")+'">'+(f.day_change_pct>=0?"+":"")+f.day_change_pct.toFixed(1)+'%</span>':'';
  var btn=(cl.bucket==="act")?'<button class="ibtn" data-review="'+t+'">Mark reviewed</button>':(cl.bucket==="watch"?'<button class="ibtn ghost" data-review="'+t+'">Reviewed</button>':'');
  return '<div class="ibx" data-go="'+t+'"><div class="il"><div class="itk">'+t+'</div><div class="inm">'+(f.name||t)+'</div></div>'
    +'<div class="ich">'+cl.line+'</div>'
    +'<div class="ir">'+day+ratingTag(s.rating)+'<span class="isc" style="color:'+c+'">'+Math.round(s.composite)+'</span>'+btn+'</div></div>';
}
function inboxErrRow(t){ return '<div class="ibx"><div class="il"><div class="itk">'+t+'</div><div class="inm">Unavailable</div></div><div class="ich sub">Could not refresh — try later</div><div class="ir"></div></div>'; }

function showInbox(){
  hide($("#result")); hide($("#error")); hide($("#loading")); show($("#home")); setUpdated();
  var wl=wlGet();
  if(!wl.length){ $("#home").innerHTML=sec("","Set up your inbox")+card('<div class="onb"><div class="onb-h">Add the tickers you hold or follow</div><div class="onb-p">Each time you open this, I tell you if any of them needs a decision today. Most days, nothing.</div><div class="wl-add"><input id="wlInput" placeholder="NVDA, MSFT, AAPL…" autocomplete="off"><button data-wladd="1">+ Add</button></div></div>','fade'); return; }
  $("#home").innerHTML=sec("","Today")+'<div id="inboxSummary" class="isum">Scanning your '+wl.length+' positions…</div>'
    +'<div id="inboxBody"><div class="loader"><span class="spin"></span><span>Checking what changed since your last review…</span></div></div>'
    +sec("","Watchlist")+card('<div id="wlSlot"></div>','fade');
  renderWatchlist(); loadInbox();
}
function loadInbox(){
  var wl=wlGet(), mem=memGet(), results={}, done=0;
  wl.forEach(function(t){
    fetch("/api/analyze?ticker="+encodeURIComponent(t)).then(function(r){return r.ok?r.json():null;}).then(function(d){
      results[t]=d; done++; if(done===wl.length) renderInbox(wl,results,mem);
    }).catch(function(){ results[t]=null; done++; if(done===wl.length) renderInbox(wl,results,mem); });
  });
}
function renderInbox(wl,results,mem){
  _inboxWL=wl; _inboxRes=results;
  var act=[],watch=[],nothing=[],errs=[],changed=false;
  wl.forEach(function(t){ var d=results[t]; if(!d){ errs.push(t); return; }
    var cl=classify(t,d,mem[t]);
    if(!mem[t]){ mem[t]=snapOf(d); changed=true; }
    var row=inboxRow(t,d,cl);
    if(cl.bucket==="act")act.push(row); else if(cl.bucket==="watch")watch.push(row); else nothing.push(row);
  });
  if(changed) memSet(mem);
  var body="";
  if(act.length) body+='<div class="ibucket"><div class="ibh act"><span class="iled act"></span>ACT NOW · '+act.length+'</div>'+act.join("")+'</div>';
  if(watch.length) body+='<div class="ibucket"><div class="ibh watch"><span class="iled watch"></span>WATCH · '+watch.length+'</div>'+watch.join("")+'</div>';
  if(!act.length&&!watch.length) body+='<div class="nothing"><div class="nh">Nothing to do today</div><div class="np">No material change across your '+(wl.length-errs.length)+' positions since your last review. You are up to date.</div></div>';
  if(nothing.length) body+='<div class="ibucket"><div class="ibh"><span class="iled"></span>UP TO DATE · '+nothing.length+'</div><div class="nothinglist">'+nothing.join("")+'</div></div>';

    +'<div class="conv"><div class="l">CONVICTION</div><div class="v" style="color:'+scoreHex(s.composite)+'"><span data-count="'+s.composite+'" data-fmt="num1">0</span><span class="sub" style="font-size:14px"> / 100 · '+s.confidence.toUpperCase()+'</span></div></div>'; }
function portfolioFit(s){
  var stars=s.composite>=80?5:s.composite>=65?4:s.composite>=50?3:s.composite>=38?2:1;
  var st=""; for(var i=1;i<=5;i++){ st+=(i<=stars?'★':'<span class="e">★</span>'); }
  var prof=[["Growth",s.growth>=65,false],["Quality",s.profitability>=65&&s.moat>=60,false],["Income",false,true],["Value",s.valuation>=60,false],["Speculative",(s.risk<=45||s.composite<45),false]];
  var chips=prof.map(function(p){ return '<span class="pchip '+(p[1]?"on":"")+' '+(p[2]?"na":"")+'"'+(p[2]?' title="No dividend data available"':"")+'>'+p[0]+'</span>'; }).join("");
  return '<div class="th-h"><span class="b" style="background:var(--accent)"></span>PORTFOLIO FIT</div>'
    +'<div class="stars">'+st+'</div>'
    +'<div class="th-h" style="margin-top:16px"><span class="b" style="background:var(--sub)"></span>INVESTMENT PROFILE</div><div class="profile">'+chips+'</div>'; }

function computeProfiles(s){ return {Growth:0.7*s.growth+0.3*s.momentum, Quality:0.5*s.profitability+0.5*s.moat, Value:s.valuation, Income:0.45*s.debt+0.35*s.risk+0.20*s.profitability, Defensive:0.5*s.risk+0.3*s.debt+0.2*s.profitability}; }
function toStars(v){ return Math.max(1,Math.min(5,Math.round(v/20))); }
function starStr(n){ var o=""; for(var i=1;i<=5;i++){ o+=(i<=n?'★':'<span class="e">★</span>'); } return o; }

function sectorCycle(f){ var t=((f.sector||"")+" "+(f.industry||"")).toLowerCase();

function prioritySignal(d){
  var f=d.fundamentals,s=d.scores,mem=memGet(),base=mem[f.ticker],high=[],med=[];
  var day=f.day_change_pct;
  if(day!=null){ if(Math.abs(day)>=4) high.push((day>=0?"+":"")+day.toFixed(1)+"% today"); else if(Math.abs(day)>=2) med.push((day>=0?"+":"")+day.toFixed(1)+"% today"); }
  var dte=f.days_to_earnings;
  if(dte!=null&&dte>=0){ if(dte<=5) high.push("Earnings in "+dte+" days"); else if(dte<=14) med.push("Earnings in "+dte+" days"); }
  if(base&&base.tm!=null&&f.target_mean!=null){ var dtm=(f.target_mean/base.tm-1)*100; if(dtm>=1) high.push("Analyst target revised upward (+"+dtm.toFixed(0)+"%)"); else if(dtm<=-1) high.push("Analyst target revised downward ("+dtm.toFixed(0)+"%)"); }
  if(base){ if(s.rating!==base.r) high.push("Rating "+base.r+" → "+s.rating); else { var dc=s.composite-base.c; if(Math.abs(dc)>=5) high.push("Score "+Math.round(base.c)+"→"+Math.round(s.composite)); else if(Math.abs(dc)>=2) med.push("Score "+Math.round(base.c)+"→"+Math.round(s.composite)); } }

  if(f.pe_history_percentile!=null){ if(f.pe_history_percentile>=80) med.push("Valuation approaching historical high"); else if(f.pe_history_percentile<=20) med.push("Valuation near historical low"); }
  var level,cls,reasons;

  return '<div class="prio '+cls+'"><div class="prio-l">'+level+'</div><ul class="prio-list">'+reasons.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>';

  if(s.rating!==base.r) rows.push('<div class="chg"><span class="ck">Rating</span><span class="cv">'+base.r+' → <b>'+s.rating+'</b></span></div>');
  if(base.tm!=null&&f.target_mean!=null){ var dt=(f.target_mean/base.tm-1)*100; if(Math.abs(dt)>=0.5) rows.push(chgRow("Analyst target",Math.round(base.tm),Math.round(f.target_mean),dt,"%")); }

    +prioritySignal(d)
    +sec("","Snapshot")+snap
    +sec("","What changed since your last review")+card(whatChanged(d),'hov fade')
    +sec("","Why now")+card(whyNow5(s),'hov fade')
    +sec("","What would make me change my mind")+card(changeMyMind(d),'hov fade')
    +sec("","Events that may change the thesis")+card(eventsFilter(d.news),'hov fade')
    +sec("","Thesis")+thesis
    +sec("","Factors & peers")+factors
    +sec("","Analyst verdict")+card(verdictBlock(d),'hov fade');
  animate($("#result")); loadPeers(f.ticker);
}

function loadPeers(ticker){
  var list=PEERS[ticker]; var slot=$("#peerSlot"); if(!slot)return;
  if(!list){ slot.innerHTML='<div class="empty">Peer set not configured for '+ticker+'.</div>'; return; }
  fetch("/api/compare?tickers="+encodeURIComponent(list.join(","))).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d||!d.ranking||!d.ranking.length){ slot.innerHTML='<div class="empty">Peer data unavailable.</div>'; return; }
    var rk=d.ranking,N=rk.length,meRank=null; for(var i=0;i<N;i++){ if(rk[i].ticker===ticker) meRank=rk[i].rank; }
    var hdr=""; if(meRank){ var pc=N>1?Math.round((N-meRank)/(N-1)*100):100; hdr='<div class="peerhdr"><div><span class="pr-rk">#'+meRank+'</span><span class="pr-d"> / '+N+'</span></div><div class="pr-pc">TOP PERCENTILE<b>'+pc+'%</b></div></div>'; }
    var maxc=Math.max.apply(null,rk.map(function(x){return x.composite;}))||100;
    var bars=rk.map(function(x){ var c=ratingHex(x.rating),me=(x.ticker===ticker); return '<div class="cbar"><div class="tk" style="'+(me?"color:var(--accent)":"")+'">'+x.ticker+(me?' ◂':"")+'</div><div class="track"><div class="fill'+(me?" me":"")+'" data-w="'+(x.composite/maxc*100).toFixed(1)+'%" style="background:'+c+'"><span class="fv">'+x.composite.toFixed(0)+'</span></div></div></div>'; }).join("");
    var pes=(d.items||[]).filter(function(it){return it.fundamentals.ticker!==ticker&&it.fundamentals.pe_forward!=null;}).map(function(it){return it.fundamentals.pe_forward;}).sort(function(a,b){return a-b;}); var med=pes.length?pes[Math.floor((pes.length-1)/2)]:null; var meIt=(d.items||[]).filter(function(it){return it.fundamentals.ticker===ticker;})[0]; var myp=meIt?meIt.fundamentals.pe_forward:null; var rel=""; if(med!=null&&myp!=null){ var prem=(myp/med-1)*100,rc=prem<=0?"var(--pos)":"var(--neg)"; rel='<div class="relval">Forward P/E <b>'+myp.toFixed(1)+'</b> vs peer median '+med.toFixed(1)+' — <span style="color:'+rc+'">'+(prem>=0?"+":"")+prem.toFixed(0)+'% '+(prem>=0?"premium":"discount")+'</span></div>'; } slot.innerHTML=hdr+rel+bars; fillBars(slot);
  }).catch(function(){ slot.innerHTML='<div class="empty">Peer data unavailable.</div>'; });
}

/* ===================== COMPARE ===================== */
function render_compare(d){ setUpdated(d.generated_at);
  var err=(d.errors&&d.errors.length)?card('Skipped: '+d.errors.join(" · "),'errbox fade'):"";
  var verdict=card('<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><span class="rtg" style="color:#3B82F6;border-color:#3B82F655;background:#3B82F614">TOP PICK · '+d.top_pick+'</span><span class="sub mono" style="font-size:12px">'+d.items.length+' COMPANIES</span></div><div class="exec">'+d.verdict+'</div>','hov fade');
  var lead=card(d.ranking.map(function(r){return '<div class="lead"><div class="rk">'+r.rank+'</div><div class="tk">'+r.ticker+'</div><div class="nm">'+(r.name||"")+'</div>'+ratingTag(r.rating)+'<div class="cs" style="color:'+ratingColor(r.rating)+'"><span data-count="'+r.composite+'" data-fmt="int">0</span></div></div>';}).join(""),'hov fade');
  var maxc=Math.max.apply(null,d.ranking.map(function(r){return r.composite;}))||100;
  var chart=card(d.ranking.map(function(r){var c=ratingHex(r.rating);return '<div class="cbar"><div class="tk">'+r.ticker+'</div><div class="track"><div class="fill" data-w="'+(r.composite/maxc*100).toFixed(1)+'%" style="background:'+c+'"><span class="fv">'+r.composite.toFixed(0)+'</span></div></div></div>';}).join(""),'hov fade');
  var cards=d.items.map(function(it){var f=it.fundamentals,s=it.scores;
    return '<div class="card hov fade"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px"><div><div class="mono" style="color:var(--accent);font-size:12px">'+f.ticker+'</div><div style="font-weight:600;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">'+(f.name||f.ticker)+'</div></div>'+ratingTag(s.rating)+'</div><div style="display:flex;align-items:baseline;gap:6px;margin:4px 0 12px"><span class="mono" style="font-size:32px;font-weight:700;color:'+ratingColor(s.rating)+'"><span data-count="'+s.composite+'" data-fmt="num1">0</span></span><span class="sub mono" style="font-size:12px">/ 100</span></div>'+DIMS.map(function(p){return fbar(p[1],s[p[0]]);}).join("")+'</div>';}).join("");
  $("#result").innerHTML='<div class="crumb" data-home="1">&larr; Today</div>'+sec("01","Analyst Verdict")+err+verdict+sec("02","Leaderboard")+lead+sec("03","Composite Comparison")+chart+sec("04","Company Breakdown")+'<div class="grid2">'+cards+'</div>'+sec("05","Side By Side")+card(compareTable(d.items),'hov fade');
  animate($("#result"));
}
function compareTable(items){ var head='<th>Metric</th>'+items.map(function(it){return '<th>'+it.fundamentals.ticker+'</th>';}).join("");
  var rd=[["composite","Composite"]].concat(DIMS);
  var rows=rd.map(function(p){var k=p[0],l=p[1];var vals=items.map(function(it){return it.scores[k];});var best=Math.max.apply(null,vals);
    var tds=items.map(function(it){var v=it.scores[k];var b=(v===best&&items.length>1);return '<td class="'+(b?"tbest":"")+'">'+v.toFixed(0)+(b?" ●":"")+'</td>';}).join("");
    return '<tr class="'+(k==="composite"?"hl":"")+'"><td>'+l+'</td>'+tds+'</tr>';}).join("");
  var md=[["Rating",function(it){return '<span style="color:'+ratingColor(it.scores.rating)+'">'+it.scores.rating+'</span>';}],["Price",function(it){return it.fundamentals.price!=null?Number(it.fundamentals.price).toFixed(2):"n/a";}],["Mkt cap",function(it){return money(it.fundamentals.market_cap);}],["Fwd P/E",function(it){return num1(it.fundamentals.pe_forward);}],["Net mgn",function(it){return pct1(it.fundamentals.profit_margin);}]];
  var mr=md.map(function(p){return '<tr><td>'+p[0]+'</td>'+items.map(function(it){return '<td>'+p[1](it)+'</td>';}).join("")+'</tr>';}).join("");
  return '<div class="scroll-x"><table class="cmp"><thead><tr>'+head+'</tr></thead><tbody>'+rows+mr+'</tbody></table></div>'; }

/* ===================== FLOW ===================== */
function show(el){el.classList.remove("hidden");} function hide(el){el.classList.add("hidden");}
function startLoading(){ hide($("#home")); hide($("#error")); $("#result").innerHTML=""; show($("#loading")); }
function stopLoading(){ hide($("#loading")); }
function parseTickers(raw){ var seen={},out=[]; (raw||"").replace(/,/g," ").split(/\s+/).forEach(function(t){t=t.trim().toUpperCase();if(t&&!seen[t]){seen[t]=1;out.push(t);}}); return out; }
function run(input){ var raw=(input!=null)?input:$("#ticker").value; var tk=parseTickers(raw); if(!tk.length)return; $("#ticker").value=tk.join(", ");
  var multi=tk.length>1; startLoading(); $("#loadingMsg").textContent=multi?("Analyzing "+tk.length+" companies…"):("Analyzing "+tk[0]+"…");
  var url=multi?("/api/compare?tickers="+encodeURIComponent(tk.join(","))):("/api/analyze?ticker="+encodeURIComponent(tk[0]));
  fetch(url).then(function(res){return res.json().then(function(data){return {ok:res.ok,data:data};});}).then(function(o){ stopLoading(); show($("#result"));
    if(!o.ok){ $("#error").textContent=(o.data&&o.data.detail)||"Analysis failed."; show($("#error")); return; }
    if(multi) render_compare(o.data); else render(o.data); window.scrollTo(0,0);
  }).catch(function(e){ stopLoading(); $("#error").textContent="Network error: "+e.message; show($("#error")); }); }

function setUpdated(ts){ var d=ts?new Date(ts):new Date(); if(isNaN(d.getTime()))d=new Date(); function p(n){return(n<10?"0":"")+n;} $("#upd").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()); }
function marketStatus(){ try{ var et=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); var day=et.getDay(),mins=et.getHours()*60+et.getMinutes(); var open=(day>=1&&day<=5&&mins>=570&&mins<960); $("#mkt").innerHTML='<span class="dot '+(open?"g":"r")+'"></span>'+(open?"OPEN":"CLOSED"); }catch(e){ $("#mkt").innerHTML='<span class="dot b"></span>—'; } }
function health(){ fetch("/api/health").then(function(r){return r.json();}).then(function(h){ $("#engine").textContent=h.llm_enabled?h.llm_provider.toUpperCase():"TEMPLATE"; }).catch(function(){ $("#engine").textContent="OFFLINE"; }); }

document.addEventListener("DOMContentLoaded",function(){
  $("#run").addEventListener("click",function(){run();});
  $("#ticker").addEventListener("keydown",function(e){ if(e.key==="Enter")run(); if(e.key==="Escape")this.value=""; });
  $("#brand").addEventListener("click",showInbox);
  document.addEventListener("keydown",function(e){ if(e.key==="/"&&document.activeElement!==$("#ticker")){e.preventDefault();$("#ticker").focus();} });
  document.addEventListener("click",function(e){
    var go=e.target.closest&&e.target.closest("[data-go]"); var rm=e.target.closest&&e.target.closest("[data-wlrm]"); var rev=e.target.closest&&e.target.closest("[data-review]"); var revall=e.target.closest&&e.target.closest("[data-reviewall]");
    var add=e.target.closest&&e.target.closest("[data-wladd]"); var hm=e.target.closest&&e.target.closest("[data-home]");
    if(rev){ e.stopPropagation(); markReviewed(rev.getAttribute("data-review")); return; }
    if(revall){ e.stopPropagation(); markAllReviewed(); return; }
    if(rm){ e.stopPropagation(); wlRemove(rm.getAttribute("data-wlrm")); return; }
    if(add){ wlAdd(); return; }
    if(hm){ showInbox(); return; }
    if(go){ run(go.getAttribute("data-go")); }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Enter"&&document.activeElement&&document.activeElement.id==="wlInput"){ wlAdd(); } });
  health(); marketStatus(); setInterval(marketStatus,30000); setUpdated();
  showInbox();
});
</script>
